---
namespace: uoa_eresearch
name: exorcism
version: 0.1.0

readme: README.md

authors:
  - Thomas Laurenson <tom.laurenson@auckland.ac.nz>

description: >-
  Ansible playbooks to implement CIS hardening.

license:
  - MIT

tags:
  - security
  - hardening
  - cis
  - compliance
  - linux
  - ubuntu

repository: https://github.com/UoA-eResearch/exorCISm
homepage: https://github.com/UoA-eResearch/exorCISm
issues: https://github.com/UoA-eResearch/exorCISm/issues

# This collection uses only ansible.builtin modules.
dependencies: {}

build_ignore:
  - .github
  - .gitignore
  - .ansible-lint
  - "*.tar.gz"
  # Development tooling and the directories it works in. A consumer reads none of
  # it, and .ansible and .venv are large enough to swamp the archive if left in:
  # together they are 5000 of the 5139 entries an unfiltered build produces.
  - .ansible
  - .python-version
  - .venv
  - Makefile
  - dist
  - pyproject.toml
  - uv.lock
  # Reference and working material that must not be redistributed. The git
  # exclude file does not apply here: collection builds obey this list alone.
  - "*.pdf"
  - CURRENT_ISSUES.md
