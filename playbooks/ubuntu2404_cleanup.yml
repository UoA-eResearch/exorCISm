---
# Removes what earlier releases of the ubuntu2404 role wrote and the current
# release no longer manages. The role only adds and changes, so a host
# upgraded in place keeps every superseded file and package until this runs.
# Run it once after upgrading the collection, dry run first:
#
#   ansible-playbook uoa_eresearch.exorcism.ubuntu2404_cleanup -i inventory.yml --check --diff
#
# Each task names the release that wrote the item and the release that stopped
# managing it, so an entry can be retired once no host predates it.
- name: Clean up after earlier releases of the Ubuntu 24.04 role
  hosts: all
  become: true

  handlers:
    - name: Reload sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true

  tasks:
    # The line was appended with no regexp, so a host whose umask changed
    # carries one per value it ever had. Matching ^umask removes them all, and
    # would also remove a line added by hand. The value still applies, because
    # the role now writes it to /etc/profile.d, which /etc/profile sources
    - name: Remove the /etc/profile umask line, written by 0.1.0 and superseded in 0.4.0
      ansible.builtin.lineinfile:
        path: /etc/profile
        regexp: '^umask\s'
        state: absent
        backup: true

    # Both files load, so a host that keeps this one keeps applying its ASLR
    # and suid_dumpable settings after 90-process-hardening.conf changes them
    - name: Remove the coredump sysctl file, written by 0.2.0 and superseded in 0.3.0
      ansible.builtin.file:
        path: /etc/sysctl.d/90-coredump.conf
        state: absent
      notify: Reload sysctl

    # CIS v2.0.0 asks only that the units are not in use, which the role achieves
    # by masking them, so the package has nothing left to do
    - name: Remove systemd-journal-remote, installed by 0.2.0 and unused since 0.3.0
      ansible.builtin.apt:
        name: systemd-journal-remote
        state: absent
        purge: true

    # The audit greps /etc/sudoers* by path and matches this file whatever its
    # name, so leaving it keeps 5.2.2 and 5.2.3 reporting as passing while sudo,
    # which skips any name containing a dot, applies neither
    - name: Remove the dotted sudo drop-in, written by 0.3.0 and superseded in 0.4.0
      ansible.builtin.file:
        path: /etc/sudoers.d/90-sudo.conf
        state: absent
