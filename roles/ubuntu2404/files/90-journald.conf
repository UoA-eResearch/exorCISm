[Journal]
# 6.1.1.1.5 Ensure journald log file rotation is configured
SystemMaxUse=1G
SystemMaxFileSize=100M
SystemKeepFree=1G

# v1.0.0 required this to be off. v2.0.0 dropped that recommendation and added
# 6.1.1.1.3, which requires ForwardToSyslog=yes, but only where rsyslog is the
# chosen client-side logging method. This role configures journald instead, so
# the value stays off; a host that forwards to rsyslog must override it.
ForwardToSyslog=no

# 6.1.1.1.7 Ensure journald Compress is configured
Compress=yes

# 6.1.1.1.6 Ensure journald Storage is configured
Storage=persistent
