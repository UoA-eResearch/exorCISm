[Journal]
# 6.1.1.1.5 Ensure journald log file rotation is configured
SystemMaxUse=1G
SystemMaxFileSize=100M
SystemKeepFree=1G

# 6.1.1.1.3 Ensure journald is configured to send logs to rsyslog
# rsyslog sets this too, in /usr/lib/systemd/journald.conf.d/syslog.conf.
# Drop-ins are read in filename order across directories, so that file is read
# after this one and overrides any other value set here.
ForwardToSyslog=yes

# 6.1.1.1.7 Ensure journald Compress is configured
Compress=yes

# 6.1.1.1.6 Ensure journald Storage is configured
Storage=persistent
