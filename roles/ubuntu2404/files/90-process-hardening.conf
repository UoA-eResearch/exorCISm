# 1.5.1 Ensure fs.protected_hardlinks is configured
fs.protected_hardlinks = 1

# 1.5.2 Ensure fs.protected_symlinks is configured
fs.protected_symlinks = 1

# 1.5.3 Ensure kernel.yama.ptrace_scope is configured
# CIS accepts 1, 2 or 3. This is 1, which is also the Ubuntu default, so it
# restricts ptrace to child processes without breaking a debugger the user
# started themselves. 2 and 3 additionally stop that.
kernel.yama.ptrace_scope = 1

# 1.5.4 Ensure fs.suid_dumpable is configured
fs.suid_dumpable = 0

# 1.5.5 Ensure kernel.dmesg_restrict is configured
kernel.dmesg_restrict = 1

# 1.5.8 Ensure kernel.kptr_restrict is configured
# CIS accepts 1 or 2. This is 1, the Ubuntu default, which hides kernel
# pointers from unprivileged readers; 2 hides them from root as well and
# breaks perf and some profiling tools.
kernel.kptr_restrict = 1

# 1.5.9 Ensure kernel.randomize_va_space is configured
kernel.randomize_va_space = 2
