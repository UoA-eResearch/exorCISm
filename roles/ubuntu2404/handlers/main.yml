---
- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart sshd
  ansible.builtin.systemd_service:
    name: sshd
    state: restarted
    enabled: true

- name: Restart chrony
  ansible.builtin.systemd_service:
    name: chrony
    state: restarted
    enabled: true

- name: Restart timesyncd
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: restarted

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
  tags: 6.1_logging

- name: Update PAM configuration
  ansible.builtin.command:
    cmd: pam-auth-update --enable unix
  changed_when: true

- name: Update dconf
  ansible.builtin.command:
    cmd: dconf update
  changed_when: true
