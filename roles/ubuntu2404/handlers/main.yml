---
- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted
    enabled: true

- name: Restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted
    enabled: true

- name: Reload iptables
  ansible.builtin.command: netfilter-persistent reload
  changed_when: true

- name: Restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
  tags: 6.1_logging
