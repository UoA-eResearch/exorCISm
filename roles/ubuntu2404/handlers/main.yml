---
# -e ignores keys the kernel does not have. A host booted with ipv6.disable=1
# has no net.ipv6 keys, and without it sysctl applies every other setting and
# then exits non-zero, failing the play.
- name: Reload sysctl
  ansible.builtin.command: sysctl -e --system
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# The unit is ssh.service. The sshd.service alias exists only while
# ssh.service is enabled, and Ubuntu 24.04 socket-activates sshd with
# ssh.service disabled, so a handler naming sshd fails on a stock host.
- name: Reload sshd
  ansible.builtin.systemd_service:
    name: ssh.service
    state: reloaded

- name: Restart chrony
  ansible.builtin.systemd_service:
    name: chrony
    state: restarted
    enabled: true

- name: Restart timesyncd
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: restarted
    enabled: true

- name: Reload iptables
  ansible.builtin.command: netfilter-persistent reload
  changed_when: true

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
  tags: 6.1_logging

- name: Update dconf
  ansible.builtin.command:
    cmd: dconf update
  changed_when: true
