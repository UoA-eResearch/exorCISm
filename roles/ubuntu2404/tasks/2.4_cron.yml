---
# One looped pair rather than six separate tasks, so a run prints one line per
# path instead of a six line JSON diff block each. The control number moves
# into the loop label, so a change is still traceable to the benchmark item it
# came from. The stat exists only to give the label a before value.
- name: 2.4.1.2-2.4.1.7 Read the current cron permissions
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop:
    - control: 2.4.1.2
      path: /etc/crontab
      state: file
      mode: "0600"
    - control: 2.4.1.3
      path: /etc/cron.hourly
      state: directory
      mode: "0700"
    - control: 2.4.1.4
      path: /etc/cron.daily
      state: directory
      mode: "0700"
    - control: 2.4.1.5
      path: /etc/cron.weekly
      state: directory
      mode: "0700"
    - control: 2.4.1.6
      path: /etc/cron.monthly
      state: directory
      mode: "0700"
    - control: 2.4.1.7
      path: /etc/cron.d
      state: directory
      mode: "0700"
  loop_control:
    label: "{{ item.path }}"
  register: exorcism_cron_paths
  changed_when: false
  tags: 2.4_cron

- name: 2.4.1.2-2.4.1.7 Ensure permissions on cron files and directories are configured
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: "{{ item.item.state }}"
    owner: root
    group: root
    mode: "{{ item.item.mode }}"
  loop: "{{ exorcism_cron_paths.results }}"
  loop_control:
    label: "{{ item.item.control }} {{ item.item.path }} {{ item.stat.mode | default('absent') }} -> {{ item.item.mode }}"
  diff: false
  tags: 2.4_cron

# Left alone, because here the diff shows the user list being written rather
# than a mode, and that is worth reading.
- name: 2.4.1.8 Ensure crontab is restricted to authorized users
  ansible.builtin.copy:
    content: "{{ (['root'] + exorcism_cron_allow_extra_users) | join('\n') }}\n"
    dest: /etc/cron.allow
    owner: root
    group: root
    mode: "0600"
    force: true
  tags: 2.4_cron
