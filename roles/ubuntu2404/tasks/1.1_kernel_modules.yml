---
# The audit reads modprobe --showconfig for an install line and a blacklist
# line per module, so one drop-in covers every control in 1.1.1. No package
# ships these modules separately, so there is nothing to remove with apt.
- name: 1.1.1.1-1.1.1.10 Ensure filesystem and hardware kernel modules are not available
  ansible.builtin.template:
    src: 90-modprobe.conf.j2
    dest: /etc/modprobe.d/90-modprobe.conf
    owner: root
    group: root
    mode: "0644"
    force: true
  tags: 1.1_kernel_modules
