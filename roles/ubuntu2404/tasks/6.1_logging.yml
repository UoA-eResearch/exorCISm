---
# Masked rather than removed, because a host with no such unit has nothing to
# stop and a host that has one must not start it again at boot. failed_when is
# off so the absent case, which is the common one, is not an error.
- name: 6.1.1.1.2 Ensure systemd-journal-remote service is not in use
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - systemd-journal-remote.socket
    - systemd-journal-remote.service
  failed_when: false
  tags: 6.1_logging

- name: Create journald configuration directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: 6.1_logging

- name: 6.1.1.1.5-6.1.1.1.7 Add journald configuration
  ansible.builtin.copy:
    src: 90-journald.conf
    dest: /etc/systemd/journald.conf.d/90-journald.conf
    owner: root
    group: root
    mode: "0644"
    force: true
  notify: Restart journald
  tags: 6.1_logging

# Stat first so the label below can name the mode each directory is coming
# from, the same way the file loop further down does.
- name: 6.1.3.1 Read the current log directory permissions
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /var/log/unattended-upgrades/
    - /var/log/installer/
    - /var/log/installer/block/
  register: exorcism_log_directories
  changed_when: false
  tags: 6.1_logging

- name: 6.1.3.1 Ensure access to all logfiles has been configured (directories)
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: directory
    mode: "0750"
    recurse: false
  loop: "{{ exorcism_log_directories.results }}"
  loop_control:
    label: "{{ item.item }} {{ item.stat.mode | default('absent') }} -> 0750"
  diff: false
  failed_when: false
  tags: 6.1_logging

# Two tasks rather than one find -exec chmod, so that a dry run reports the
# files it would touch. A single shell task is skipped in check mode, which
# would hide the largest change this role makes to /var/log. -printf carries
# the current mode back with each path, so the task below can label each file
# with what it is changing from rather than emit a JSON diff block per file.
#
# -perm /137 matches only files carrying a bit the control forbids: owner
# execute, group write or execute, or anything for other. Testing for "not
# already 0640" instead would also match files shipped tighter than that, such
# as boot.log at 0600, and setting those to 0640 loosens them. The control is a
# ceiling, not a target, so a file already below it is left alone.
- name: 6.1.3.1 Find logfiles with permissions wider than 0640
  ansible.builtin.command:
    argv:
      - find
      - /var/log
      - -type
      - f
      - '!'
      - -name
      - lastlog*
      - '!'
      - -name
      - btmp*
      - '!'
      - -name
      - wtmp*
      - -perm
      - /137
      - -printf
      - "%m %p\n"
  register: exorcism_wide_logfiles
  failed_when: false
  changed_when: false
  # Read-only, so it runs during a dry run too. Without this it registers
  # nothing and the task below has no list to report on.
  check_mode: false
  tags: 6.1_logging

# The lastlog, btmp and wtmp files are excluded above, rotated copies included.
# They are owned by the utmp group and read through it by lastlog(1) and
# last(1), so 0640 root:utmp breaks both for every non-root user. Their shipped
# modes already satisfy the control.
#
# Module diff output is off because the label carries the same information in
# one line. The mode arrives from find as %m, which drops the leading zero, so
# pad it back.
- name: 6.1.3.1 Ensure access to all logfiles has been configured (all files in /var/log)
  ansible.builtin.file:
    path: "{{ exorcism_logfile.1 }}"
    mode: "0640"
  loop: "{{ exorcism_wide_logfiles.stdout_lines | default([]) }}"
  vars:
    exorcism_logfile: "{{ item.split(' ', 1) }}"
  loop_control:
    label: "{{ exorcism_logfile.1 }} {{ '%04d' | format(exorcism_logfile.0 | int) }} -> 0640"
  diff: false
  failed_when: false
  tags: 6.1_logging
