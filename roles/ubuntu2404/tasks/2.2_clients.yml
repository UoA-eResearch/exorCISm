---
# Purged rather than removed, because CIS v2.0.0 remediates every control in
# 2.2 with apt purge, and a removed package lingers in dpkg as config-files
- name: 2.2.1 Ensure nis client is not installed
  ansible.builtin.apt:
    name: nis
    state: absent
    purge: true
  tags: 2.2_clients

- name: 2.2.2 Ensure rsh client is not installed
  ansible.builtin.apt:
    name: rsh-client
    state: absent
    purge: true
  tags: 2.2_clients

- name: 2.2.3 Ensure talk client is not installed
  ansible.builtin.apt:
    name: talk
    state: absent
    purge: true
  tags: 2.2_clients

- name: 2.2.4 Ensure telnet client is not installed
  ansible.builtin.apt:
    name:
      - telnet
      - inetutils-telnet
    state: absent
    purge: true
  tags: 2.2_clients

- name: 2.2.5 Ensure ldap client is not installed
  ansible.builtin.apt:
    name: ldap-utils
    state: absent
    purge: true
  tags: 2.2_clients

# CIS names both packages, and Ubuntu ships tnftp as the ftp command: the
# audit greps dpkg for '^(ftp|tnftp)', so removing only one leaves the control
# failing while the client is still on the host. ubuntu-standard depends on
# one of the two, so this removes that metapackage as well; CIS v2.0.0 offers
# no alternative for a client.
- name: 2.2.6 Ensure ftp client is not installed
  ansible.builtin.apt:
    name:
      - ftp
      - tnftp
    state: absent
    purge: true
  tags: 2.2_clients
