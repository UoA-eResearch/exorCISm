---
- name: 1.5.1-1.5.9 Ensure process hardening kernel parameters are configured
  ansible.builtin.copy:
    src: 90-process-hardening.conf
    dest: /etc/sysctl.d/90-process-hardening.conf
    owner: root
    group: root
    mode: "0644"
    force: true
  notify: Reload sysctl
  tags: 1.5_core_dumps

# ufw applies /etc/ufw/sysctl.conf when it starts, and systemd-sysctl applies
# /etc/sysctl.conf last, so a value in either beats the file above. The audit
# reads both first for the same reason. CIS v2.0.0 remediates by commenting
# such lines out, which is done here for every key the file above sets.
- name: 1.5.1-1.5.9 Check for sysctl files applied after sysctl.d
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/ufw/sysctl.conf
    - /etc/sysctl.conf
  register: exorcism_process_sysctl_overrides
  tags: 1.5_core_dumps

- name: 1.5.1-1.5.9 Ensure no later sysctl file overrides the process hardening kernel parameters
  ansible.builtin.replace:
    path: "{{ item.item }}"
    regexp: '^([ \t]*(?:{{ exorcism_process_sysctl_keys }})[ \t]*=.*)$'
    replace: '# \1'
  loop: "{{ exorcism_process_sysctl_overrides.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"
  vars:
    exorcism_process_sysctl_keys: >-
      {{ lookup('ansible.builtin.file', '90-process-hardening.conf')
         | regex_findall('(?m)^([a-z0-9_.]+) =')
         | map('regex_replace', '\.', '[./]') | join('|') }}
  notify: Reload sysctl
  tags: 1.5_core_dumps

- name: Disable core dumps in /etc/security/limits.conf
  ansible.builtin.copy:
    src: 90-disablecore.conf
    dest: /etc/security/limits.d/90-disablecore.conf
    owner: root
    group: root
    mode: "0644"
    force: true
  tags: 1.5_core_dumps

- name: Ensure systemd-coredump is installed
  ansible.builtin.apt:
    name: systemd-coredump
    state: present
  tags: 1.5_core_dumps

- name: Create the systemd-coredump configuration directory
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: 1.5_core_dumps

- name: 1.5.10, 1.5.11 Ensure systemd-coredump ProcessSizeMax and Storage are configured
  ansible.builtin.copy:
    src: 60-coredump.conf
    dest: /etc/systemd/coredump.conf.d/60-coredump.conf
    owner: root
    group: root
    mode: "0644"
    force: true
  notify: Reload systemd
  tags: 1.5_core_dumps

# CIS accepts either removing apport or leaving it installed with reporting
# switched off. Removal is the default because it is the stronger of the two,
# but it cascades on desktop and DGX images, so the second path exists.
- name: 1.5.7 Ensure Automatic Error Reporting is configured (remove apport)
  ansible.builtin.apt:
    name: apport
    state: absent
    purge: true
  when: exorcism_remove_apport
  tags: 1.5_core_dumps

- name: 1.5.7 Ensure Automatic Error Reporting is configured (disable apport)
  when: not exorcism_remove_apport
  tags: 1.5_core_dumps
  block:
    - name: 1.5.7 Set enabled=0 in /etc/default/apport
      ansible.builtin.lineinfile:
        path: /etc/default/apport
        regexp: ^enabled=
        line: enabled=0
        owner: root
        group: root
        mode: "0644"
        create: true

    - name: 1.5.7 Ensure the apport service is stopped and masked
      ansible.builtin.systemd_service:
        name: apport.service
        state: stopped
        enabled: false
        masked: true
      failed_when: false
