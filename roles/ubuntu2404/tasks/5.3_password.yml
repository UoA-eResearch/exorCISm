---
- name: 5.3.1.3 Ensure libpam-pwquality is installed
  ansible.builtin.apt:
    name: libpam-pwquality
    state: present
  tags: 5.3_password

- name: 5.3.2.2 Ensure pam_faillock module is enabled (faillock)
  ansible.builtin.copy:
    src: pam_faillock
    dest: /usr/share/pam-configs/faillock
    owner: root
    group: root
    mode: "0644"
    force: true
  tags: 5.3_password

- name: 5.3.2.3 Ensure pam_faillock_notify module is enabled (faillock notify)
  ansible.builtin.copy:
    src: pam_faillock_notify
    dest: /usr/share/pam-configs/faillock_notify
    owner: root
    group: root
    mode: "0644"
    force: true
  tags: 5.3_password

- name: 5.3.2.3 Ensure pam_pwquality module is enabled (pwquality)
  ansible.builtin.copy:
    src: pam_pwquality
    dest: /usr/share/pam-configs/pwquality
    owner: root
    group: root
    mode: "0644"
    force: true
  tags: 5.3_password

- name: 5.3.2.3 Ensure pam_pwquality module is enabled (enable)
  ansible.builtin.command:
    cmd: pam-auth-update --enable pwquality
  changed_when: false
  tags: 5.3_password

- name: 5.3.2.4 Ensure pam_pwhistory module is enabled (pwhistory)
  ansible.builtin.copy:
    src: pam_pwhistory
    dest: /usr/share/pam-configs/pwhistory
    owner: root
    group: root
    mode: "0644"
    force: true
  tags: 5.3_password

- name: 5.3.2.4 Ensure pam_pwhistory module is enabled (enable)
  ansible.builtin.command:
    cmd: pam-auth-update --enable pwhistory
  changed_when: false
  tags: 5.3_password

- name: 5.3.3.2.1 Ensure password number of changed characters is configured
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    line: "deny = 5"
    create: true
    backup: true
    mode: "0644"
  tags: 5.3_password

- name: 5.3.3.1.2 Ensure password unlock time is configured
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    line: "unlock_time = 900"
    create: true
    backup: true
    mode: "0644"
  tags: 5.3_password

- name: 5.3.3.1.3 Ensure password failed attempts lockout includes root account
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    line: "root_unlock_time = 60"
    create: true
    backup: true
    mode: "0644"
  tags: 5.3_password

- name: 5.3.3.1.X Ensure pwquality configuration directory exists
  ansible.builtin.file:
    path: /etc/security/pwquality.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: 5.3_password

- name: 5.3.3.1.X Password Complexity Configuration
  ansible.builtin.copy:
    src: 90-pwquality.conf
    dest: /etc/security/pwquality.conf.d/90-pwquality.conf
    owner: root
    group: root
    mode: "0644"
    force: true
  tags: 5.3_password

- name: 5.3.3.3.1 Ensure password history remember is configured
  ansible.builtin.lineinfile:
    path: /etc/security/opasswd
    line: "remember = 24"
    create: true
    backup: true
    mode: "0600"
  tags: 5.3_password

- name: 5.3.3.4.1 Ensure pam_unix does not include nullok
  ansible.builtin.replace:
    path: /etc/pam.d/common-auth
    regexp: '\bnullok\b'
    replace: ''
  tags: 5.3_password
