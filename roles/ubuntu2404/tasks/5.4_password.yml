---
# Ageing and inactivity locking apply only to users whose shadow field 2 starts
# with '$', meaning a real local hash. This excludes Kerberos ('!') and locked
# ('*') accounts, for which a local expiry date is meaningless and chage fails.
# Each line is name:max:warn:inactive, shadow fields 5 to 7, so the tasks below
# change only an account outside the range CIS v2.0.0 audits, and never loosen
# one a site has already set tighter.
- name: Get users with UID >= 1000 that have a local password hash
  ansible.builtin.shell: |
    set -o pipefail
    awk -F: 'NR==FNR { if ($2~/^\$/) ageing[$1]=$5":"$6":"$7; next }
      $3>=1000 && $3!=65534 && $7!~/(false|nologin)$/ &&
      {% if exorcism_password_excluded_users | length > 0 %}$1!~/^({{ exorcism_password_excluded_users | join('|') }})$/ &&{% endif %}
      ($1 in ageing) { print $1":"ageing[$1] }' /etc/shadow /etc/passwd
  args:
    executable: /bin/bash
  register: exorcism_local_password_users
  changed_when: false
  # Runs during a dry run as well: skipped, it registers nothing and the tasks
  # that read it silently skip instead of reporting what they would change
  check_mode: false
  tags: 5.4_password

- name: 5.4.1.1 Ensure password expiration is configured (login.defs)
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^\s*PASS_MAX_DAYS\s+'
    line: 'PASS_MAX_DAYS   365'
    state: present
    insertafter: EOF
    backup: true
  tags: 5.4_password

# The conditions mirror the audit's "$5 > 365 || $5 < 1". An empty field
# fails it, because awk degrades that to the string comparison "" < "1".
- name: 5.4.1.1 Ensure password expiration is configured (existing local users)
  ansible.builtin.command:
    cmd: "chage -M 365 {{ item.0 }}"
  loop: "{{ exorcism_local_password_users.stdout_lines | map('split', ':') | list }}"
  loop_control:
    label: "{{ item.0 }} {{ item.1 or 'unset' }} -> 365"
  when: item.1 == '' or item.1 | int > 365 or item.1 | int < 1
  changed_when: true
  tags: 5.4_password

- name: 5.4.1.3 Ensure password expiration warning days is configured (login.defs)
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^PASS_WARN_AGE'
    line: "PASS_WARN_AGE  7"
    state: present
    backup: true
  tags: 5.4_password

# The conditions mirror the audit's "$6 < 7"
- name: 5.4.1.3 Ensure password expiration warning days is configured (existing local users)
  ansible.builtin.command:
    cmd: "chage -W 7 {{ item.0 }}"
  loop: "{{ exorcism_local_password_users.stdout_lines | map('split', ':') | list }}"
  loop_control:
    label: "{{ item.0 }} {{ item.2 or 'unset' }} -> 7"
  when: item.2 == '' or item.2 | int < 7
  changed_when: true
  tags: 5.4_password

- name: 5.4.1.5 Ensure inactive password lock is configured (check)
  ansible.builtin.command:
    cmd: useradd -D
  register: exorcism_useradd_defaults
  changed_when: false
  check_mode: false
  tags: 5.4_password

- name: 5.4.1.5 Ensure inactive password lock is configured (default)
  ansible.builtin.command:
    cmd: "useradd -D -f {{ exorcism_inactive_password_lock_days | int }}"
  when: "( 'INACTIVE=' ~ (exorcism_inactive_password_lock_days | int) ) not in exorcism_useradd_defaults.stdout"
  changed_when: true
  tags: 5.4_password

# Use chage rather than the user module, which leaves shadow field 7 empty
# while useradd -D reports the right default. The conditions mirror the
# audit's "$7 > 45 || $7 < 0", with the site's value as the ceiling. An empty
# field fails it, because awk degrades that to the string comparison "" < "0".
- name: 5.4.1.5 Ensure inactive password lock is configured (existing users)
  ansible.builtin.command:
    cmd: "chage -I {{ exorcism_inactive_password_lock_days | int }} {{ item.0 }}"
  loop: "{{ exorcism_local_password_users.stdout_lines | map('split', ':') | list }}"
  loop_control:
    label: "{{ item.0 }} {{ item.3 or 'unset' }} -> {{ exorcism_inactive_password_lock_days | int }}"
  when: >-
    item.3 == ''
    or item.3 | int > exorcism_inactive_password_lock_days | int
    or item.3 | int < 0
  changed_when: true
  tags: 5.4_password

- name: 5.4.2.5 Ensure root path integrity
  ansible.builtin.file:
    path: /snap/bin
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: 5.4_password

- name: LEGACY 5.4.3.2 Remove TMOUT entry from /etc/profile if present
  ansible.builtin.lineinfile:
    path: /etc/profile
    regexp: 'TMOUT'
    state: absent
    backup: true
  tags: 5.4_password

- name: 5.4.3.2 Configure shell timeout globally
  ansible.builtin.copy:
    dest: /etc/profile.d/90-tmout.sh
    content: "{{ lookup('file', '90-shelltimeout.conf') }}"
    owner: root
    group: root
    mode: '0644'
    force: true
  tags: 5.4_password

# CIS v2.0.0 audits exactly two places for this: a file ending in .sh under
# /etc/profile.d, and /etc/login.defs. /etc/profile is in neither, nor in the
# remediation, whose own example is 60-default_umask.sh.
- name: 5.4.3.3 Ensure default user umask is configured (profile.d)
  ansible.builtin.copy:
    dest: /etc/profile.d/60-default_umask.sh
    content: "umask {{ exorcism_default_umask }}\n"
    owner: root
    group: root
    mode: "0644"
    force: true
  tags: 5.4_password

- name: 5.4.3.3 Ensure default user umask is configured (login.defs)
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^UMASK'
    line: "UMASK {{ exorcism_default_umask }}"
    state: present
    backup: true
  tags: 5.4_password
