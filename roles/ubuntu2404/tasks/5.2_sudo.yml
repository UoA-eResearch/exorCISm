---
# No .conf suffix: sudo ignores every file in /etc/sudoers.d whose name
# contains a dot, so a suffixed file is written and never applied, while the
# audit greps /etc/sudoers* by path and matches it regardless, reporting both
# controls as passing. Validated with visudo, because a malformed file here
# locks everyone out of root.
- name: 5.2.2, 5.2.3 Ensure sudo commands use pty and a log file exists
  ansible.builtin.copy:
    src: 90-sudo
    dest: /etc/sudoers.d/90-sudo
    owner: root
    group: root
    mode: "0440"
    force: true
    validate: visudo -cf %s
  tags: 5.2_sudo

- name: 5.2.7 Ensure access to the su command is restricted (create group)
  ansible.builtin.group:
    name: "{{ exorcism_su_group }}"
    state: present
  tags: 5.2_sudo

- name: 5.2.7 Ensure access to the su command is restricted (pam_wheel)
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    line: "auth required pam_wheel.so use_uid group={{ exorcism_su_group }}"
    create: false
    backup: true
  tags: 5.2_sudo
