---
# Default variables for the ubuntu2404 CIS hardening role.
#
# Every variable the role consumes is declared here. Values are deliberately
# neutral: the role ships nothing site-specific, so an unconfigured run applies
# the OS-level hardening controls without granting or revoking access to any
# particular account, host or network.

# SECTION TOGGLES
# 2.3 Time synchronisation. Disabled by default: configuring chrony without
# setting exorcism_ntp_servers would leave a host with no time source.
exorcism_time_section_enabled: false

# 4.4 Firewall. Disabled by default: the shipped rulesets set a default-DROP
# policy and would cut a host off if applied without review.
exorcism_firewall_section_enabled: false
exorcism_firewall_manage_rules_ipv4: false
exorcism_firewall_manage_rules_ipv6: false

# 1.6 BANNERS
# Written to /etc/motd, /etc/issue and /etc/issue.net.
exorcism_banner_text: "Authorized users only. All activity may be monitored and reported."

# 2.3 TIME SYNCHRONISATION
# NTP sources for chrony. Empty means the role writes no server lines.
exorcism_ntp_servers: []

# 2.4 CRON
# Additional users permitted to use crontab. Root is always included.
exorcism_cron_allow_extra_users: []

# 3.3 NETWORK
# Hosts that route traffic (Docker, KVM, k3s, NAT) need forwarding enabled.
exorcism_ipv4_ip_forward: 0
exorcism_ipv6_forwarding: 0

# 5.1 SSH
# Accounts permitted to log in over SSH. An empty list omits the AllowUsers
# directive entirely, which permits all users; setting it REPLACES the list.
exorcism_ssh_allow_users: []

# Applies sshd DisableForwarding. Bastion hosts need this set to false.
exorcism_ssh_disable_forwarding: true

# Path on the managed host to a file of trusted SSH CA public keys. Empty
# means no CA configuration is deployed. Placing the key file itself is out
# of scope for this role.
exorcism_ssh_trusted_user_ca_keys: ""

# 5.2 SUDO
# Group whose members may use su, enforced via pam_wheel.
exorcism_su_group: sugroup

# 5.4 PASSWORD AND ACCOUNT POLICY
# Days of inactivity after which an account is locked.
exorcism_inactive_password_lock_days: 45

# Default umask applied via /etc/profile and /etc/login.defs.
exorcism_default_umask: "027"

# Service accounts with UID >= 1000 that must be exempt from password ageing
# and inactivity locking. Empty means every UID >= 1000 account is included.
exorcism_password_excluded_users: []
