---
# Section toggles. Each controls whether a whole CIS section is applied.
# Numbers match the CIS Ubuntu 24.04 benchmark, the task file names and the
# task tags, so a section can be traced from here to the controls it applies.
# Why a section is on or off by default is in meta/argument_specs.yml, which
# ansible-doc renders.

exorcism_section_1_1_kernel_modules_enabled: true
exorcism_section_1_3_apparmor_enabled: false
exorcism_section_1_5_core_dumps_enabled: true
exorcism_section_1_6_banner_enabled: true
exorcism_section_1_7_gdm_enabled: true
exorcism_section_2_1_services_enabled: true
exorcism_section_2_2_clients_enabled: true
exorcism_section_2_3_time_enabled: true
exorcism_section_2_4_cron_enabled: true
exorcism_section_3_1_wireless_enabled: true
exorcism_section_3_2_net_modules_enabled: true
exorcism_section_3_3_net_enabled: true
exorcism_section_4_4_firewall_enabled: false
exorcism_section_5_1_ssh_enabled: true
exorcism_section_5_2_sudo_enabled: true
exorcism_section_5_3_password_enabled: true
exorcism_section_5_4_password_enabled: true
exorcism_section_6_1_logging_enabled: true
exorcism_section_6_3_integrity_enabled: false
