---
# Filesystem and hardware modules prevented from loading. Each becomes an
# "install <module> /bin/false" and a "blacklist <module>" line.
#
# overlay is required by every container runtime, so blacklisting it breaks
# Docker, containerd and k3s. Such hosts must name it in the exclude list
# below rather than have it removed from here.
exorcism_blacklist_kernel_modules:
  - cramfs
  - freevxfs
  - hfs
  - hfsplus
  - jffs2
  - overlay
  - squashfs
  - udf
  - usb-storage
  - firewire-core

# Modules to leave loadable, removed from the list above. Container hosts need
# overlay, and hosts that use snaps need squashfs.
exorcism_blacklist_kernel_modules_exclude: []
