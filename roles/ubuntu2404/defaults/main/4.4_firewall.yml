---
# Inbound TCP ports to accept. Everything else is dropped by the default policy
exorcism_firewall_allowed_tcp_ports: [22]

# Whether the host may open new outbound connections
exorcism_firewall_allow_all_outbound: true

# Extra rules appended verbatim to the filter table, in iptables-save syntax
exorcism_firewall_extra_rules_v4: []
exorcism_firewall_extra_rules_v6: []
