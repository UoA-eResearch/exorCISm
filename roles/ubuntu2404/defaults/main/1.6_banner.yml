---
# Warning written to /etc/issue and /etc/issue.net, shown before a login completes
exorcism_banner_text: "Authorized users only. All activity may be monitored and reported."

# Written to /etc/motd, shown after a successful login
exorcism_motd_text: "{{ exorcism_banner_text }}"

# 1.6.6. Set every MOTD file to 0644 owned by root, which stops the dynamic MOTD
exorcism_restrict_motd_files: true
