---
# Which time daemon to configure. "auto" uses whichever is already present and
# never switches, so a stock Ubuntu host stays on systemd-timesyncd and a host
# already running chrony keeps it. Set timesyncd or chrony explicitly to switch,
# which stops and masks the other daemon.
exorcism_time_daemon: auto

# NTP sources. Empty leaves the daemon's own configuration alone, which on
# Ubuntu means the servers shipped with the distribution.
#
# No organisation's time servers are set here on purpose. A default pointing
# at one site's infrastructure would silently be used by every other
# consumer of this collection. Set it per site instead, in the playbook or
# in inventory, alongside exorcism_time_daemon if a specific daemon is
# required.
exorcism_ntp_servers: []
