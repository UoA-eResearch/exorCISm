name: PR

on:
  pull_request:
    paths:
      - ".ansible-lint"
      - ".github/workflows/**"
      - "CHANGELOG.md"
      - "Makefile"
      - "galaxy.yml"
      - "meta/**"
      - "playbooks/**"
      - "pyproject.toml"
      - "roles/**"
      - "uv.lock"

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  test:
    uses: ./.github/workflows/test.yml
