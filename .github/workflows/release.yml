name: Release

on:
  workflow_call:

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: make check_version_tag TAG=${{ github.ref_name }}
      - run: make check_version
      - run: make build
      - name: Publish the release
        run: |
          make get_changelog > release-notes.md
          gh release create "${{ github.ref_name }}" dist/*.tar.gz \
            --title "${{ github.ref_name }}" --notes-file release-notes.md
