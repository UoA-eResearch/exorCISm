name: Test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The declared floor, the release where the templating rewrite most often
        # breaks collections, and current. Wildcards track patch releases.
        ansible-core: ["2.16.*", "2.19.*", "2.21.*"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: make test ANSIBLE_CORE=${{ matrix.ansible-core }}
