name: Test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The declared floor, the release where the templating rewrite most often
        # breaks collections, and current. Wildcards track patch releases.
        ansible-core: ["2.16.*", "2.19.*", "2.21.*"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: make test ANSIBLE_CORE=${{ matrix.ansible-core }}
