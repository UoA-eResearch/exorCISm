name: Test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The declared floor, the release where the templating rewrite most often
        # breaks collections, and current. Wildcards track patch releases.
        ansible-core: ["2.16.*", "2.19.*", "2.21.*"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: make test ANSIBLE_CORE=${{ matrix.ansible-core }}
